[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "single-factor-quant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
